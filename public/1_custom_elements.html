<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/shared.css">
        <title>Web Components - Custom Elements</title>
    </head>
    <body>
        <h1>Custom Elements</h1>

        <time-formatted id="elem"
            year="numeric" month="long" day="numeric"
            hour="numeric" minute="numeric" second="numeric"
            timezone-name="short">
        </time-formatted>

        <user-info id="info"></user-info>
        <button is="hello-button">
            say hello
        </button>
        <button is="hello-button" disabled>
            you can't say hello
        </button>
        <script src="./scripts/shared.js"></script>
        <script src="./scripts/1_custom_elements.js"></script>
    </body>
</html>
